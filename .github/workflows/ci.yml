name: ci

on:
  # Local-devops mode: automatic GitHub Actions triggers are disabled.
  # Run pyxflow locally, or dispatch this workflow manually if explicitly approved.
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-test:
    runs-on:
      - self-hosted
      - pyxflow
      - linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

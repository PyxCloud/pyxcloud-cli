name: release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish built assets from an existing v-prefixed release tag after every native gate succeeds'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  portable:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse publication outside an existing version tag
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ]; then
            [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
            test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$(git rev-parse HEAD)"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Guard release packaging contract
        run: python3 scripts/test_native_cli_release.py
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: ${{ inputs.publish && 'release --clean --skip=publish' || 'release --snapshot --clean --skip=publish' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build existing MSI
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y msitools wixl
          VERSION=0.0.0
          if [ "$PUBLISH" = true ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          EXE_PATH=$(find dist/ -name pyxcloud.exe | grep windows_amd64 | head -n 1)
          test -n "$EXE_PATH"
          wixl -D Version="$VERSION" -D BinaryPath="$EXE_PATH" -o dist/pyxcloud-installer-amd64.msi windows/installer.wxs
      - uses: actions/upload-artifact@v4
        with:
          name: cli-portable
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.apk
            dist/*.deb
            dist/*.rpm
            dist/*.msi
          if-no-files-found: error
  native-macos:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Owned disposable Keychain test fixture
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/passo-owned-fixture.keychain-db"
          security create-keychain -p fixture-only "$FIXTURE"
          security unlock-keychain -p fixture-only "$FIXTURE"
          security default-keychain -s "$FIXTURE"
          PASSO_KEYCHAIN_ROUNDTRIP=1 CGO_ENABLED=1 go test ./internal/passoauth -count=1
      - name: Build real native CLI and framework verification
        env:
          ARCH: ${{ matrix.arch }}
          CLI_RELEASE_VERSION: ${{ inputs.publish && github.ref_name || 'snapshot' }}
        run: scripts/build-native-cli.sh "$ARCH" dist-native
      - uses: actions/upload-artifact@v4
        with:
          name: cli-macos-${{ matrix.arch }}
          path: dist-native/*.tar.gz
          if-no-files-found: error
  publish:
    timeout-minutes: 15
    needs: [portable, native-macos]
    if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true
      - name: Verify all native and portable assets and compute aggregate checksums
        run: |
          set -euo pipefail
          test -s release-assets/pyxcloud_Darwin_x86_64.tar.gz
          test -s release-assets/pyxcloud_Darwin_arm64.tar.gz
          cp scripts/install.sh release-assets/install.sh
          (cd release-assets && sha256sum * > checksums.txt && sha256sum -c checksums.txt)
      - name: Publish reviewed existing tag after complete artifact gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --draft --generate-notes --title "PyxCloud CLI $GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false
